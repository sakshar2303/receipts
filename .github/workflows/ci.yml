name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Smoke run on the demo
        run: node dist/receipts.js check demo --no-llm --format all
      - uses: actions/upload-artifact@v4
        with:
          name: receipts-report-node-${{ matrix.node }}
          path: receipts-report/
